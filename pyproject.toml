[project]
name = "hptui"
version = "0.1.0"
description = "Turn any --help output into an interactive command builder"
readme = "README.md"
authors = [
    { name = "KhalidOwlWalid", email = "khalidowlwalid@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hptui = "hptui:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
