name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      # Both frontends must import on every OS (windows-curses provides curses on Windows).
      - run: uv run python -c "import hptui.curses_ui, hptui.textual_ui; print('frontends ok')"
      - run: uv run hptui --help
