name: build

# Builds hptui.exe on Windows. Runs on demand (Actions tab -> build -> Run workflow)
# and on version tags (git tag v0.1.0 && git push --tags), which also attach the
# .exe to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group build
      - run: uv run --group build python scripts/build_exe.py
      - name: Smoke test
        # Only non-interactive checks: there is no one to press keys on a CI machine.
        run: |
          dist\hptui.exe --help
          "exe size: {0:N1} MB" -f ((Get-Item dist\hptui.exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: hptui-windows
          path: dist/hptui.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hptui.exe
